name: Build and deploy dashboard

# Rebuilds the dashboard whenever match CSVs, logos, the template, or the
# build script change on main — and lets you trigger it manually from the
# Actions tab ("Run workflow") after uploading new files.
#
# Deploys using the classic "publish to a branch" method (gh-pages) instead
# of the newer Actions-native Pages deployment (actions/deploy-pages). The
# native method occasionally gets stuck in a "Queued" state for hours due to
# a GitHub-side concurrency lock on the github-pages environment that doesn't
# always release cleanly (a known, widely-reported issue, not specific to
# this repo). Publishing to a branch sidesteps that lock entirely and is a
# much older, more battle-tested mechanism.
on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "assets/**"
      - "template/**"
      - "scripts/**"
      - ".github/workflows/build-and-deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build dashboard
        run: |
          python scripts/build_dashboard.py \
            --data-dir data \
            --logos-dir assets/logos \
            --template template/dashboard_template.html \
            --out dist/index.html

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: gh-pages
